components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-cp_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type: *id001
        title: *id001
        status:
          type: integer
        code: *id001
        detail: *id001
        traceId: *id001
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field: *id001
              code: *id001
              message: *id001
            required:
            - field
            - code
            - message
      required:
      - type
      - title
      - status
      - code
      - traceId
    OperationAck:
      type: object
      additionalProperties: false
      properties:
        operationId: *id002
        resourceId: *id002
        status:
          type: string
          enum:
          - QUEUED
          - PENDING
          - UNKNOWN
        statusUrl: *id001
      required:
      - operationId
      - status
      - statusUrl
    Context:
      type: object
      additionalProperties: false
      properties:
        tenantId: *id002
        tenantName: *id001
        unitId: *id002
        unitLabel: *id001
        role: *id001
        capabilities:
          type: array
          items: *id001
      required:
      - tenantId
      - tenantName
      - role
      - capabilities
    Membership:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        tenantId: *id002
        unitId: *id002
        accountId: *id002
        displayName: *id001
        role:
          type: string
          enum:
          - RESIDENT
          - HOUSEHOLD
          - OWNER_NONRESIDENT
          - CONCIERGE
          - MANAGER
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - REVOKED
        validFrom: *id003
        validUntil: *id003
        version: &id004
          type: integer
          minimum: 1
      required:
      - id
      - tenantId
      - accountId
      - displayName
      - role
      - status
      - version
    Unit:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        blockId: *id002
        label: *id001
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      required:
      - id
      - label
      - status
    Amenity:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id001
        capacity:
          type: integer
          minimum: 1
        approvalRequired:
          type: boolean
        feeCents:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - BRL
        bufferMinutes:
          type: integer
          minimum: 0
        rulesText: *id001
