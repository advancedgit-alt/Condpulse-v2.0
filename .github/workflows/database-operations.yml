name: CondPulse database operations (manual)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operacao explicita; inspect nunca escreve no banco
        type: choice
        options: [inspect, baseline, migrate]
        default: inspect
        required: true
      expected_commit:
        description: SHA completo revisado da branch principal (40 hex)
        type: string
        required: true
      baseline_ack:
        description: Somente baseline; rpnrqfrfwywglvyykgrg:002:FINGERPRINT da inspecao
        type: string
        required: false
      migration_ack:
        description: Somente migrate; rpnrqfrfwywglvyykgrg:003-005:SHA_REVISADO
        type: string
        required: false
      maintenance_confirmed:
        description: Escrita aprovada, backup compativel e janela exclusiva sem outro DDL
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: condpulse-database-operations-rpnrqfrfwywglvyykgrg
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'advancedgit-alt/Condpulse-v2.0' && github.ref == 'refs/heads/ccr-5e725112-3x8hyg'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Validate manual request before releasing environment secrets
        env:
          REQUEST_OPERATION: ${{ inputs.operation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          BASELINE_ACK: ${{ inputs.baseline_ack }}
          MIGRATION_ACK: ${{ inputs.migration_ack }}
          MAINTENANCE_CONFIRMED: ${{ inputs.maintenance_confirmed }}
        run: |
          node --input-type=module <<'REQUEST_GATE'
          // BEGIN AUDITABLE_REQUEST_GATE
          export function validateRequest(env) {
            const project = 'rpnrqfrfwywglvyykgrg';
            if (env.GITHUB_EVENT_NAME !== 'workflow_dispatch'
                || env.GITHUB_REPOSITORY !== 'advancedgit-alt/Condpulse-v2.0'
                || env.GITHUB_REF !== 'refs/heads/ccr-5e725112-3x8hyg') throw Error('REQUEST_CONTEXT_DENIED');
            if (!/^[a-f0-9]{40}$/.test(env.EXPECTED_COMMIT ?? '') || env.EXPECTED_COMMIT !== env.GITHUB_SHA)
              throw Error('EXACT_REVIEWED_COMMIT_REQUIRED');
            if (!['inspect', 'baseline', 'migrate'].includes(env.REQUEST_OPERATION)) throw Error('OPERATION_DENIED');
            if (env.REQUEST_OPERATION !== 'inspect' && env.MAINTENANCE_CONFIRMED !== 'true') throw Error('MAINTENANCE_ACK_REQUIRED');
            if (env.REQUEST_OPERATION === 'baseline') {
              if (!new RegExp(`^${project}:002:[a-f0-9]{64}$`).test(env.BASELINE_ACK ?? '') || env.MIGRATION_ACK)
                throw Error('EXPLICIT_BASELINE_ACK_REQUIRED');
            } else if (env.BASELINE_ACK) throw Error('BASELINE_ACK_NOT_APPLICABLE');
            if (env.REQUEST_OPERATION === 'migrate') {
              if (env.MIGRATION_ACK !== `${project}:003-005:${env.EXPECTED_COMMIT}`) throw Error('EXPLICIT_MIGRATION_ACK_REQUIRED');
            } else if (env.MIGRATION_ACK) throw Error('MIGRATION_ACK_NOT_APPLICABLE');
          }
          // END AUDITABLE_REQUEST_GATE
          try { validateRequest(process.env); console.log('REQUEST_APPROVED_FOR_ENVIRONMENT_GATE'); }
          catch (error) { console.error(error.message); process.exitCode = 1; }
          REQUEST_GATE
  database-operation:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'advancedgit-alt/Condpulse-v2.0' && github.ref == 'refs/heads/ccr-5e725112-3x8hyg'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: condpulse-database-operations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Build reviewed source without database credentials
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          mvn -B -ntp -f apps/backend/pom.xml -DskipTests package
          sha256sum apps/backend/target/condpulse-backend-0.1.0-SNAPSHOT.jar
          mkdir -p "$RUNNER_TEMP/condpulse-db-operations/classes"
          cd "$RUNNER_TEMP/condpulse-db-operations/classes"
          jar -xf "$GITHUB_WORKSPACE/apps/backend/target/condpulse-backend-0.1.0-SNAPSHOT.jar"
      - name: Fetch and validate public Supabase CA using verified HTTPS
        run: |
          set -euo pipefail
          umask 077
          ca="$RUNNER_TEMP/condpulse-db-operations/db-ca.crt"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 5 --max-time 20 --max-filesize 65536 \
            'https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt' -o "$ca"
          test "$(wc -c < "$ca")" -le 65536
          test "$(grep -c '^-----BEGIN CERTIFICATE-----$' "$ca")" -eq 1
          openssl x509 -in "$ca" -noout -checkend 86400
          openssl x509 -in "$ca" -noout -ext basicConstraints | grep -Eq '^[[:space:]]*CA:TRUE([,[:space:]]|$)'
          openssl verify -check_ss_sig -CAfile "$ca" "$ca"
          openssl x509 -in "$ca" -noout -sha256 -fingerprint
          sudo install -d -m 0755 /run/secrets
          sudo install -m 0444 "$ca" /run/secrets/db-ca.crt
      - name: Compile isolated migration guard without credentials
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/condpulse-db-operations/DatabaseOperationsMigrateGuard.java" <<'MIGRATION_GUARD'
          // BEGIN AUDITABLE_MIGRATION_GUARD
          package br.com.condpulse.bootstrap;
          import java.math.BigInteger;
          import java.sql.*;
          import java.util.*;
          import org.flywaydb.core.Flyway;
          import org.flywaydb.core.api.CoreErrorCode;
          import org.flywaydb.core.api.logging.LogFactory;
          public final class DatabaseOperationsMigrateGuard {
            private static void require(boolean value) { if (!value) throw new IllegalStateException(); }
            private static Set<Integer> history(Connection c) throws Exception {
              Set<Integer> applied = new TreeSet<>(); boolean baseline = false;
              try (var q = c.prepareStatement("select version,type,success,checksum from platform.flyway_schema_history order by installed_rank")) {
                q.setQueryTimeout(10);
                try (var r = q.executeQuery()) {
                  while (r.next()) {
                    require(r.getString("version") != null && r.getBoolean("success"));
                    int version = new BigInteger(r.getString("version")).intValueExact();
                    if (!baseline) { require(version == 2 && "BASELINE".equals(r.getString("type"))); baseline = true; }
                    else { require(version >= 3 && version <= 5 && "SQL".equals(r.getString("type")) && r.getObject("checksum") != null && applied.add(version)); }
                  }
                }
              }
              require(baseline);
              for (int version = 3; version < 3 + applied.size(); version++) require(applied.contains(version));
              return applied;
            }
            public static void main(String[] args) {
              java.util.logging.LogManager.getLogManager().reset();
              LogFactory.setLogCreator(new BootstrapBaseline.QuietLogCreator());
              try {
                require(args.length == 0);
                BootstrapBaseline.productionConfig(System.getenv());
                require(BootstrapManifest.sourceCodes(BootstrapManifest.load()).isEmpty());
                require("postgres.rpnrqfrfwywglvyykgrg".equals(System.getenv("DATABASE_USER")));
                var properties = new Properties();
                properties.setProperty("user", System.getenv("DATABASE_USER"));
                properties.setProperty("password", System.getenv("DATABASE_PASSWORD"));
                properties.setProperty("connectTimeout", "5"); properties.setProperty("socketTimeout", "20");
                try (var c = DriverManager.getConnection(System.getenv("DATABASE_URL"), properties)) {
                  c.setReadOnly(true);
                  try (var q = c.prepareStatement("select current_user,pg_try_advisory_lock(?)")) {
                    q.setQueryTimeout(10); q.setLong(1, BootstrapBaseline.LOCK_KEY);
                    try (var r = q.executeQuery()) { require(r.next() && "postgres".equals(r.getString(1)) && r.getBoolean(2)); }
                  }
                  try (var q = c.prepareStatement("select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('platform','cp') and c.relkind in ('r','p','S') and pg_get_userbyid(c.relowner)<>'postgres'")) {
                    q.setQueryTimeout(10);
                    try (var r = q.executeQuery()) { require(r.next() && r.getLong(1)==0); }
                  }
                  try (var q = c.prepareStatement("select (select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('platform','cp') and pg_get_userbyid(p.proowner)<>'postgres') + (select count(*) from pg_namespace where nspname in ('platform','cp') and pg_get_userbyid(nspowner)<>'postgres')")) {
                    q.setQueryTimeout(10);
                    try (var r = q.executeQuery()) { require(r.next() && r.getLong(1)==0); }
                  }
                  Set<Integer> applied = history(c);
                  var flyway = Flyway.configure().dataSource(System.getenv("DATABASE_URL"), System.getenv("DATABASE_USER"), System.getenv("DATABASE_PASSWORD"))
                    .defaultSchema("platform").schemas("platform", "cp").createSchemas(false)
                    .locations("classpath:db/migration").baselineOnMigrate(false).cleanDisabled(true)
                    .validateMigrationNaming(true).validateOnMigrate(true).outOfOrder(false).target("005")
                    .loggers(BootstrapBaseline.QuietLogCreator.class.getName()).load();
                  Set<Integer> expected = new TreeSet<>(Set.of(3,4,5)); expected.removeAll(applied);
                  Set<Integer> pending = new TreeSet<>();
                  for (var migration : flyway.info().pending()) require(pending.add(new BigInteger(migration.getVersion().toString()).intValueExact()));
                  require(pending.equals(expected));
                  var validation = flyway.validateWithResult();
                  require(validation.invalidMigrations.size() == expected.size());
                  Set<Integer> invalid = new TreeSet<>();
                  for (var migration : validation.invalidMigrations) {
                    require(migration.errorDetails.errorCode == CoreErrorCode.RESOLVED_VERSIONED_MIGRATION_NOT_APPLIED);
                    require(invalid.add(new BigInteger(migration.version).intValueExact()));
                  }
                  require(invalid.equals(expected) && validation.validationSuccessful == expected.isEmpty());
                  var result = flyway.migrate();
                  flyway.validate(); require(history(c).equals(Set.of(3,4,5)));
                  require(flyway.info().pending().length == 0);
                  System.out.println("{\"migrated\":true,\"validated\":true,\"target\":\"005\",\"migrationsExecuted\":" + result.migrationsExecuted + "}");
                }
              } catch (Exception ignored) {
                System.out.println("{\"migrated\":false,\"code\":\"MIGRATION_GUARD_FAILED_OR_RESULT_UNKNOWN\"}");
                System.exit(1);
              }
            }
          }
          // END AUDITABLE_MIGRATION_GUARD
          MIGRATION_GUARD
          javac -cp "$RUNNER_TEMP/condpulse-db-operations/classes/BOOT-INF/classes:$RUNNER_TEMP/condpulse-db-operations/classes/BOOT-INF/lib/*" \
            -d "$RUNNER_TEMP/condpulse-db-operations/classes/BOOT-INF/classes" "$RUNNER_TEMP/condpulse-db-operations/DatabaseOperationsMigrateGuard.java"
      - name: Execute only the manually selected database operation
        env:
          DATABASE_PASSWORD: ${{ secrets.CP_DATABASE_OPERATIONS_PASSWORD }}
          REQUEST_OPERATION: ${{ inputs.operation }}
          CP_BASELINE_ACK: ${{ inputs.baseline_ack }}
        run: |
          node --input-type=module <<'EXECUTE'
          import {spawnSync} from 'node:child_process';
          // BEGIN AUDITABLE_OPERATION_LAUNCHER
          import {join} from 'node:path';
          export function operationInvocation(source) {
            const operation=source.REQUEST_OPERATION;
            const commands={inspect:['br.com.condpulse.bootstrap.BootstrapBaseline','inspect'],
              baseline:['br.com.condpulse.bootstrap.BootstrapBaseline','baseline'],
              migrate:['br.com.condpulse.bootstrap.DatabaseOperationsMigrateGuard']};
            if(!Object.hasOwn(commands,operation) || !source.DATABASE_PASSWORD) throw Error('OPERATION_CONFIGURATION_INVALID');
            const base=join(source.RUNNER_TEMP,'condpulse-db-operations/classes/BOOT-INF');
            const env={PATH:source.PATH,JAVA_HOME:source.JAVA_HOME,
              DATABASE_URL:'jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=verify-full&sslrootcert=/run/secrets/db-ca.crt',
              DATABASE_USER:'postgres.rpnrqfrfwywglvyykgrg',DATABASE_PASSWORD:source.DATABASE_PASSWORD,
              CP_BASELINE_PROJECT_REF:'rpnrqfrfwywglvyykgrg',CP_BASELINE_ACK:source.CP_BASELINE_ACK??''};
            return {executable:join(source.JAVA_HOME,'bin/java'),args:['-Xmx768m',
              `-Dlogback.configurationFile=${base}/classes/bootstrap/logback-baseline.xml`,
              '-cp',`${base}/classes:${base}/lib/*`,...commands[operation]],env};
          }
          // END AUDITABLE_OPERATION_LAUNCHER
          // The password is passed only in the environment, never argv, a file or a log.
          const invocation=operationInvocation(process.env);
          const result=spawnSync(invocation.executable,invocation.args,{env:invocation.env,stdio:'inherit',timeout:15*60*1000});
          if(result.error || result.signal) {console.error('OPERATION_PROCESS_FAILED_OR_RESULT_UNKNOWN');process.exitCode=1;}
          else process.exitCode=result.status===0?0:1;
          EXECUTE
      - name: Remove ephemeral CA and build extraction
        if: always()
        run: |
          set -euo pipefail
          sudo rm -f -- /run/secrets/db-ca.crt
          node --input-type=module <<'CLEANUP'
          import {rmSync,existsSync,realpathSync,lstatSync} from 'node:fs';
          import {resolve,dirname,basename} from 'node:path';
          const target=resolve(process.env.RUNNER_TEMP,'condpulse-db-operations');
          if(existsSync(target)) {
            const actual=realpathSync(target), base=realpathSync(process.env.RUNNER_TEMP);
            if(lstatSync(target).isSymbolicLink() || dirname(actual)!==base || basename(actual)!=='condpulse-db-operations') throw Error('CLEANUP_TARGET_DENIED');
            rmSync(actual,{recursive:true,force:true});
          }
          CLEANUP
