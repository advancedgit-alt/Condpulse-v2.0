name: CondPulse runtime configuration (manual)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: inspect consulta; apply cria credencial runtime e configura o projeto Vercel fixo
        type: choice
        options: [inspect, apply]
        default: inspect
        required: true
      generation:
        description: UUID canonico aprovado da geracao; identifica um login runtime novo
        type: string
        required: true
      expected_commit:
        description: SHA completo revisado da branch principal (40 hex)
        type: string
        required: true
      runtime_ack:
        description: Somente apply; ACK completo com projeto, geracao, SHA e fingerprint da inspecao
        type: string
        required: false
      maintenance_confirmed:
        description: Escrita aprovada e janela exclusiva sem migracao ou outro provisionamento
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: condpulse-database-operations-rpnrqfrfwywglvyykgrg
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'advancedgit-alt/Condpulse-v2.0' && github.ref == 'refs/heads/ccr-5e725112-3x8hyg'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Validate manual request before releasing environment secrets
        env:
          CP_RUNTIME_OPERATION: ${{ inputs.operation }}
          CP_RUNTIME_GENERATION: ${{ inputs.generation }}
          CP_RUNTIME_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CP_RUNTIME_ACK: ${{ inputs.runtime_ack }}
          MAINTENANCE_CONFIRMED: ${{ inputs.maintenance_confirmed }}
        run: |
          node --input-type=module <<'REQUEST_GATE'
          import {validateRequest} from './infra/scripts/runtime-configuration/launch.mjs';
          try { validateRequest(process.env); console.log('REQUEST_APPROVED_FOR_ENVIRONMENT_GATE'); }
          catch { console.error('RUNTIME_MANUAL_REQUEST_DENIED'); process.exitCode=1; }
          REQUEST_GATE
  runtime-configuration:
    needs: gate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'advancedgit-alt/Condpulse-v2.0' && github.ref == 'refs/heads/ccr-5e725112-3x8hyg'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: condpulse-database-operations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Verify policy and build reviewed source without credentials
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          node --test tests/runtime-configuration-policy.test.mjs
          mvn -B -ntp -f apps/backend/pom.xml -DskipTests package
          sha256sum apps/backend/target/condpulse-backend-0.1.0-SNAPSHOT.jar
          sha256sum infra/scripts/runtime-configuration/*.java infra/scripts/runtime-configuration/launch.mjs
          mkdir -p "$RUNNER_TEMP/condpulse-runtime-configuration/classes"
          cd "$RUNNER_TEMP/condpulse-runtime-configuration/classes"
          jar -xf "$GITHUB_WORKSPACE/apps/backend/target/condpulse-backend-0.1.0-SNAPSHOT.jar"
      - name: Compile isolated runtime helper without credentials
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/condpulse-runtime-configuration/classes"
          javac -cp "$classes/BOOT-INF/classes:$classes/BOOT-INF/lib/*" -d "$classes" infra/scripts/runtime-configuration/*.java
      - name: Fetch and validate public Supabase CA using verified HTTPS
        run: |
          set -euo pipefail
          umask 077
          ca="$RUNNER_TEMP/condpulse-runtime-configuration/db-ca.crt"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 5 --max-time 20 --max-filesize 65536 \
            'https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt' -o "$ca"
          test "$(wc -c < "$ca")" -le 65536
          test "$(grep -c '^-----BEGIN CERTIFICATE-----$' "$ca")" -eq 1
          openssl x509 -in "$ca" -noout -checkend 86400
          openssl x509 -in "$ca" -noout -ext basicConstraints | grep -Eq '^[[:space:]]*CA:TRUE([,[:space:]]|$)'
          openssl verify -check_ss_sig -CAfile "$ca" "$ca"
          openssl x509 -in "$ca" -noout -sha256 -fingerprint
          sudo install -d -m 0755 /run/secrets
          sudo install -m 0444 "$ca" /run/secrets/db-ca.crt
      - name: Execute only the manually selected runtime operation
        env:
          DATABASE_PASSWORD: ${{ secrets.CP_DATABASE_OPERATIONS_PASSWORD }}
          CP_VERCEL_TOKEN: ${{ secrets.CP_VERCEL_TOKEN }}
          CP_RUNTIME_OPERATION: ${{ inputs.operation }}
          CP_RUNTIME_GENERATION: ${{ inputs.generation }}
          CP_RUNTIME_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CP_RUNTIME_ACK: ${{ inputs.runtime_ack }}
          MAINTENANCE_CONFIRMED: ${{ inputs.maintenance_confirmed }}
        run: |
          node infra/scripts/runtime-configuration/launch.mjs --classes "$RUNNER_TEMP/condpulse-runtime-configuration/classes"
      - name: Remove ephemeral CA and build extraction
        if: always()
        run: |
          set -euo pipefail
          sudo rm -f -- /run/secrets/db-ca.crt
          node --input-type=module <<'CLEANUP'
          import {rmSync,existsSync,realpathSync,lstatSync} from 'node:fs';
          import {resolve,dirname,basename} from 'node:path';
          const target=resolve(process.env.RUNNER_TEMP,'condpulse-runtime-configuration');
          if(existsSync(target)) {
            const actual=realpathSync(target), base=realpathSync(process.env.RUNNER_TEMP);
            if(lstatSync(target).isSymbolicLink() || dirname(actual)!==base || basename(actual)!=='condpulse-runtime-configuration') throw Error('CLEANUP_TARGET_DENIED');
            rmSync(actual,{recursive:true,force:true});
          }
          CLEANUP
