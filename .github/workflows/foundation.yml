name: CondPulse foundation
on:
  push:
permissions:
  contents: read
concurrency:
  group: condpulse-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: condpulse_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: condpulse_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d condpulse_ci"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      # Somente credenciais sinteticas do container descartavel do job.
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: condpulse_ci
      PGUSER: postgres
      PGPASSWORD: condpulse_ci_only
      CP_DB_TEST_OK: DISPOSABLE
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Register failure annotations
        run: echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/condpulse.json"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Foundation and contract checks
        run: node --test --test-reporter=tap tests/foundation.test.mjs tests/spec-package.test.mjs tests/integration/https-bff-guard.test.mjs tests/vercel-config.test.mjs
      - name: Specification package structural validation on a temporary copy
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q python3-yaml; }
          copy="$RUNNER_TEMP/condpulse-spec"
          mkdir -p "$copy" && cp -R spec "$copy/"
          python3 -I "$copy/spec/qualidade/validar_estrutura.py"
      - name: BFF staging guards and protocol without managed credentials
        run: node --test --test-reporter=tap tests/bff-configuration.test.mjs tests/bff-configuration-policy.test.mjs tests/runtime-flags.test.mjs tests/fly-api.test.mjs tests/fly-worker.test.mjs
      - name: Manual onboarding boundary without managed credentials
        run: node --test --test-reporter=tap tests/onboarding-operations.test.mjs tests/onboarding-operations-policy.test.mjs
      - name: Compile and unit tests
        run: |
          set +e
          mvn -B -ntp -f apps/backend/pom.xml verify 2>&1 | tee "$RUNNER_TEMP/maven-verify.log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || bash tests/ci/annotate-tail.sh "$RUNNER_TEMP/maven-verify.log" "Maven verify" 80
          exit "$status"
      - name: Real onboarding CLI protocol without managed credentials or network
        env:
          CP_ONBOARDING_JAVA_TEST_REQUIRED: "true"
        run: node --test --test-reporter=tap tests/onboarding-operations-java.test.mjs
      - name: Manual database executor guards without managed credentials
        # Em série: os dois harnesses migram bancos novos desde a V001 no mesmo cluster, antes de as roles da
        # aplicação existirem; em paralelo, as V002 concorrentes colidem em pg_authid (CREATE ROLE duplicado).
        run: node --test --test-concurrency=1 --test-reporter=tap tests/database-operations.test.mjs tests/production-database-operations.test.mjs
      - name: Runtime credential executor guards and disposable provisioning
        run: node --test --test-reporter=tap tests/runtime-configuration-policy.test.mjs tests/runtime-configuration.test.mjs
      - name: Fly runtime login executor and disposable provisioning
        # Depois do harness da Vercel, nunca em paralelo: os dois exigem zero logins cp_runtime no cluster ao começar.
        env:
          CP_FLY_JAVA_TEST_REQUIRED: "true"
        run: node --test --test-reporter=tap tests/fly-api-java.test.mjs
      - name: Fly worker login executor and disposable provisioning
        # Depois do harness da API na Fly, nunca em paralelo: exige zero logins cp_runtime/cp_worker no cluster ao começar.
        env:
          CP_FLY_WORKER_JAVA_TEST_REQUIRED: "true"
        run: node --test --test-reporter=tap tests/fly-worker-java.test.mjs
      - name: Migrate with Flyway and validate replay
        env:
          SPRING_PROFILES_ACTIVE: migrate
          DATABASE_URL: jdbc:postgresql://localhost:5432/condpulse_ci
          DATABASE_USER: postgres
          DATABASE_PASSWORD: condpulse_ci_only
        run: |
          java -jar apps/backend/target/condpulse-backend-0.1.0-SNAPSHOT.jar
          java -jar apps/backend/target/condpulse-backend-0.1.0-SNAPSHOT.jar
      - name: PostgreSQL isolation and concurrency
        env:
          CP_SCHEMA_ALREADY_MIGRATED: "true"
        run: |
          set +e
          { python3 -m unittest discover -s tests/database -p 'test_reservation_race.py' && python3 tests/database/run.py; } 2>&1 | tee "$RUNNER_TEMP/sql-suite.log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || bash tests/ci/annotate-tail.sh "$RUNNER_TEMP/sql-suite.log" "PostgreSQL suite" 40
          exit "$status"
      - name: HTTP readiness and missing-token smoke
        # BFF exige origem/chave HTTPS reais; o teste de API abaixo permanece Bearer.
        env:
          SPRING_PROFILES_ACTIVE: api
          DATABASE_URL: jdbc:postgresql://localhost:5432/condpulse_ci
          DATABASE_USER: cp_ci_login
          DATABASE_PASSWORD: synthetic_ci_runtime_only
          CP_JWT_ISSUER: https://auth.example.invalid
          CP_JWT_JWK_SET_URI: https://auth.example.invalid/jwks.json
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE cp_ci_login LOGIN PASSWORD 'synthetic_ci_runtime_only' IN ROLE cp_api"
          java -jar apps/backend/target/condpulse-backend-0.1.0-SNAPSHOT.jar > /tmp/condpulse-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness; then ready=1; break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat /tmp/condpulse-api.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/condpulse-api.log; exit 1; fi
          status=$(curl -sS -o /tmp/condpulse-auth.json -w '%{http_code}' http://127.0.0.1:8080/v1/me)
          test "$status" = "401"
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/condpulse-auth.json','utf8')); if(p.code!=='AUTHENTICATION_REQUIRED') process.exit(1)"
      - name: HTTP readiness with the homologation flag set
        # Mesmo conjunto de flags da Vercel Production; chaves BFF sintéticas geradas pelo próprio script.
        env:
          SPRING_PROFILES_ACTIVE: api
          PORT: "8081"
          DATABASE_URL: jdbc:postgresql://localhost:5432/condpulse_ci
          DATABASE_USER: cp_ci_login
          DATABASE_PASSWORD: synthetic_ci_runtime_only
          CP_JWT_ISSUER: https://auth.example.invalid/auth/v1
          CP_JWT_JWK_SET_URI: https://auth.example.invalid/auth/v1/.well-known/jwks.json
          CP_BFF_ORIGIN: https://condpulse.example.invalid
          CP_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SYNTHETIC_TEST_ONLY_1234567890
          CP_BFF_ENABLED: "true"
          CP_RESERVATIONS_ENABLED: "true"
          CP_MANAGEMENT_ENABLED: "true"
          CP_PLATFORM_ENABLED: "true"
          CP_PLATFORM_BILLING_ENABLED: "true"
          CP_PARCELS_ENABLED: "true"
          CP_VISITS_ENABLED: "true"
          CP_NOTIFICATIONS_ENABLED: "true"
          CP_ANNOUNCEMENTS_ENABLED: "true"
          CP_REQUESTS_ENABLED: "true"
          CP_ACCESS_CREDENTIALS_ENABLED: "true"
        run: bash tests/runtime/homologation-flags-smoke.sh
      - name: HTTP readiness with realtime channel enabled
        # BFF e chaves sintéticas geradas no script; prova que o canal sobe e exige sessão.
        env:
          SPRING_PROFILES_ACTIVE: api
          PORT: "8083"
          DATABASE_URL: jdbc:postgresql://localhost:5432/condpulse_ci
          DATABASE_USER: cp_ci_login
          DATABASE_PASSWORD: synthetic_ci_runtime_only
          CP_JWT_ISSUER: https://auth.example.invalid/auth/v1
          CP_JWT_JWK_SET_URI: https://auth.example.invalid/auth/v1/.well-known/jwks.json
          CP_BFF_ORIGIN: https://condpulse.example.invalid
          CP_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SYNTHETIC_TEST_ONLY_1234567890
          CP_BFF_ENABLED: "true"
          CP_REALTIME_ENABLED: "true"
        run: bash tests/runtime/realtime-flag-smoke.sh
      - name: HTTP readiness with private attachments enabled
        # Emissor no formato do Supabase e chave de serviço sintética; nenhuma chamada ao Storage.
        env:
          SPRING_PROFILES_ACTIVE: api
          PORT: "8082"
          DATABASE_URL: jdbc:postgresql://localhost:5432/condpulse_ci
          DATABASE_USER: cp_ci_login
          DATABASE_PASSWORD: synthetic_ci_runtime_only
          CP_JWT_ISSUER: https://aaaaaaaaaaaaaaaaaaaa.supabase.co/auth/v1
          CP_JWT_JWK_SET_URI: https://aaaaaaaaaaaaaaaaaaaa.supabase.co/auth/v1/.well-known/jwks.json
          CP_REQUESTS_ENABLED: "true"
          CP_FILES_ENABLED: "true"
        run: bash tests/runtime/files-flag-smoke.sh
      - name: Durable BFF session database invariants
        run: psql -X -v ON_ERROR_STOP=1 -f tests/database/bff_sessions.sql
      - name: JDBC runtime and connection pool isolation
        env:
          CP_JDBC_TEST_OK: DISPOSABLE
          CP_TEST_DB_USER: cp_ci_login
          CP_TEST_DB_PASSWORD: synthetic_ci_runtime_only
          # Login sintético do worker, membro somente de cp_worker (nunca de cp_api).
          CP_TEST_WORKER_DB_USER: cp_ci_worker
          CP_TEST_WORKER_DB_PASSWORD: synthetic_ci_worker_only
        run: |
          set +e
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE cp_ci_worker LOGIN PASSWORD 'synthetic_ci_worker_only' IN ROLE cp_worker" || exit 1
          mvn -B -ntp -f apps/backend/pom.xml -Dtest=JdbcPoolIsolationTest,WebSessionStoreJdbcTest,ReservationServiceJdbcTest,AuthRateLimiterJdbcTest,OperationalOnboardingJdbcTest,LocalManagementJdbcTest,MembershipInvitationJdbcTest,ReservationDecisionJdbcTest,RecoveryStoreJdbcTest,PlatformAdministrationJdbcTest,BillingJdbcTest,ParcelJdbcTest,VisitJdbcTest,AccessJdbcTest,OutboxWorkerJdbcTest,DatabaseRoleGuardJdbcTest,AnnouncementJdbcTest,RequestJdbcTest,UnitImportJdbcTest,AttachmentJdbcTest,RealtimeJdbcTest,PermitLinkJdbcTest,ReservationGuestJdbcTest,VisitRuleJdbcTest,WaitlistJdbcTest,WaitlistWorkerJdbcTest,DelegationJdbcTest,MoveJdbcTest,CredentialJdbcTest,CredentialWorkerJdbcTest,DeviceEventWorkerJdbcTest,DeviceHealthWorkerJdbcTest,OutboxOperationsJdbcTest,OccurrenceJdbcTest,RentalJdbcTest,PlatformTenantCreationJdbcTest,FinanceJdbcTest,TechnicalGrantJdbcTest,AccessSubjectJdbcTest,AccessAgeJdbcTest test 2>&1 | tee "$RUNNER_TEMP/maven-jdbc.log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || bash tests/ci/annotate-tail.sh "$RUNNER_TEMP/maven-jdbc.log" "JDBC tests" 80
          exit "$status"
      - name: Worker profile processes a synthetic task without HTTP
        run: bash tests/database/worker-smoke.sh
      - name: Build real web assets for integrated HTTPS smoke
        working-directory: apps/web
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: HTTPS web and BFF with real API and disposable PostgreSQL
        run: node tests/integration/https-bff-smoke.mjs
      - name: Build pinned API image and verify hardened runtime
        run: |
          docker build -f infra/Dockerfile.api -t condpulse-api:ci .
          bash tests/database/image-smoke.sh '${{ job.services.postgres.id }}'
      - name: Legacy bootstrap attestation and official baseline
        env:
          CP_JDBC_TEST_OK: DISPOSABLE
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE condpulse_bootstrap_ci'
          mvn -B -ntp -f apps/backend/pom.xml -Dtest=BootstrapBaselineJdbcTest test
      - name: Isolated baseline image defaults to inspection and redacts errors
        run: |
          docker build -f infra/Dockerfile.api --target baseline -t condpulse-baseline:ci .
          bash tests/database/baseline-image-smoke.sh
      - name: Isolated onboarding launcher redacts errors without network
        run: |
          docker build -f infra/Dockerfile.api --target onboarding -t condpulse-onboarding:ci .
          bash tests/database/onboarding-image-smoke.sh
      - name: Build Vercel API image and verify fail-closed launcher
        run: |
          docker build -f Dockerfile.vercel -t condpulse-vercel:ci .
          bash tests/database/vercel-image-smoke.sh
      - name: Build Fly worker image and verify fail-closed launcher
        run: |
          docker build -f infra/fly-worker/Dockerfile -t condpulse-fly-worker:ci .
          bash tests/database/fly-worker-image-smoke.sh
  access-gateway:
    # Gateway de acesso facial (apps/access-gateway): sem banco, sem credencial gerenciada e sem equipamento real.
    # Testes de contrato usam servidores HTTP falsos; simulador não é homologação (docs/integracoes/facial/GATEWAY.md).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Register failure annotations
        run: echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/condpulse.json"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
      - name: Gateway compile, domain and vendor contract tests
        run: |
          set +e
          mvn -B -ntp -f apps/access-gateway/pom.xml verify 2>&1 | tee "$RUNNER_TEMP/gateway-verify.log"
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || bash tests/ci/annotate-tail.sh "$RUNNER_TEMP/gateway-verify.log" "Gateway verify" 80
          exit "$status"
      - name: Build pinned gateway image and verify it starts switched off
        run: |
          docker build -f infra/access-gateway/Dockerfile -t condpulse-access-gateway:ci .
          output=$(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --network none \
            --tmpfs /tmp --tmpfs /data condpulse-access-gateway:ci 2>&1)
          status=$?
          echo "$output" | tail -n 20
          test "$status" -eq 0
          echo "$output" | grep -q "Gateway desligado"
  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Register failure annotations
        run: echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/condpulse.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install checksum-verified Compose 5.2.0
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/condpulse-docker-config
        run: |
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          plugin="$DOCKER_CONFIG/cli-plugins/docker-compose"
          curl -fLsS https://github.com/docker/compose/releases/download/v5.2.0/docker-compose-linux-x86_64 -o "$plugin"
          printf '%s  %s\n' '018f9612ecabc5f2d7aaa53d6f5f44453a87611e2d72c8ef84d7b1eca070e719' "$plugin" | sha256sum -c -
          chmod +x "$plugin"
          docker compose version --short
      - name: Validate release boundaries and actual Compose rendering
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/condpulse-docker-config
        run: |
          node --test --test-reporter=tap tests/release-config.test.mjs tests/release-compose.test.mjs tests/vercel-config.test.mjs
          sh -n infra/vercel/start-api.sh
          sh -n infra/fly-worker/start-worker.sh
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Register failure annotations
        run: echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/condpulse.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install locked web dependencies
        run: npm ci --no-fund --no-audit
      - name: Web protocol and time zone tests
        run: npm test
      - name: Strict typecheck and web build
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Build and run hardened web image
        working-directory: .
        run: |
          docker build -f infra/Dockerfile.web -t condpulse-web:ci .
          docker network create condpulse-web-ci
          docker run -d --name condpulse-web-ci --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --network condpulse-web-ci -p 127.0.0.1:4180:8080 condpulse-web:ci
          ready=0
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4180/healthz; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs condpulse-web-ci; exit 1; fi
          curl -fsS -D /tmp/condpulse-web-headers http://127.0.0.1:4180/entrar -o /tmp/condpulse-web-index
          node -e "const fs=require('node:fs');const h=fs.readFileSync('/tmp/condpulse-web-headers','utf8').toLowerCase();for(const n of ['content-security-policy:','x-content-type-options: nosniff','cache-control: no-store'])if(!h.includes(n))throw Error('Header ausente: '+n)"
      - name: Proxy routing and API DNS replacement
        working-directory: .
        run: bash tests/web/proxy-smoke.sh
      - name: Browser journeys against production image
        env:
          CP_E2E_BASE_URL: http://127.0.0.1:4180
        run: npm run test:e2e
      # Evidência visual da identidade (ADR-0010): capturas por perfil, tema e tamanho, só com dados sintéticos.
      - name: Upload visual identity captures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: identidade-visual-capturas
          path: apps/web/test-results/identidade/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove disposable web image container
        if: always()
        working-directory: .
        run: |
          docker rm -f condpulse-web-ci || true
          docker network rm condpulse-web-ci || true

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install locked mobile dependencies
        run: npm ci --no-fund --no-audit
      - name: Strict typecheck
        run: npm run typecheck
      - name: Session, vault and screen tests
        run: npm test
      - name: No secret or service key in the app source
        run: |
          if grep -rEn "sb_secret_|service_role|SUPABASE_SERVICE|CP_STORAGE_SERVICE_KEY" --include=*.ts --include=*.tsx --include=*.json --exclude-dir=node_modules --exclude-dir=__tests__ . ; then exit 1; fi
      - name: Android JavaScript bundle with synthetic public config
        env:
          EXPO_OFFLINE: "1"
          EXPO_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SYNTHETIC_TEST_ONLY_1234567890
          EXPO_PUBLIC_API_URL: https://api.example.invalid
        run: |
          npx expo export --platform android --output-dir "$RUNNER_TEMP/mobile-export"
          bundle=$(find "$RUNNER_TEMP/mobile-export" -name '*.hbc' | head -1)
          test -n "$bundle"
          grep -q 'abcdefghijklmnopqrst.supabase.co' "$bundle"
