name: CondPulse public runtime smoke
on:
  push:
    branches: [ccr-5e725112-3x8hyg]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: condpulse-public-runtime-smoke
  cancel-in-progress: true
jobs:
  public-smoke:
    if: github.repository == 'advancedgit-alt/Condpulse-v2.0' && github.ref == 'refs/heads/ccr-5e725112-3x8hyg'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Verify the current Production deployment without application credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'PUBLIC_SMOKE'
          import {setTimeout as sleep} from 'node:timers/promises';
          const repository = 'advancedgit-alt/Condpulse-v2.0';
          const branch = 'ccr-5e725112-3x8hyg';
          const origin = 'https://project-rhvdq.vercel.app';
          const sha = process.env.SOURCE_SHA;
          class CheckError extends Error { constructor(code) { super(code); this.code = code; } }
          const ensure = (condition, code) => { if (!condition) throw new CheckError(code); };
          ensure(/^[a-f0-9]{40}$/.test(sha ?? ''), 'SOURCE_INVALID');
          ensure(Boolean(process.env.GH_READ_TOKEN), 'GITHUB_TOKEN_REQUIRED');
          async function readJson(response, limit) {
            const reader = response.body?.getReader();
            ensure(reader, 'EMPTY_BODY');
            const chunks = []; let size = 0;
            try {
              for (;;) {
                const next = await reader.read();
                if (next.done) break;
                size += next.value.byteLength;
                if (size > limit) { await reader.cancel(); throw new CheckError('BODY_TOO_LARGE'); }
                chunks.push(Buffer.from(next.value));
              }
            } finally { reader.releaseLock(); }
            try { return JSON.parse(Buffer.concat(chunks).toString('utf8')); }
            catch { throw new CheckError('BODY_NOT_JSON'); }
          }
          async function github(path) {
            const response = await fetch('https://api.github.com/repos/' + repository + path, {
              method: 'GET', redirect: 'manual', credentials: 'omit',
              headers: {Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + process.env.GH_READ_TOKEN},
              signal: AbortSignal.timeout(10000)
            });
            ensure(response.status === 200, 'GITHUB_HTTP_' + response.status);
            return readJson(response, 262144);
          }
          async function requireCurrentHead() {
            const head = await github('/branches/' + branch);
            ensure(head.commit?.sha === sha, 'SOURCE_SUPERSEDED');
          }
          function checkedDeployment(value) {
            let url;
            try { url = new URL(value); } catch { throw new CheckError('VERCEL_TARGET_INVALID'); }
            ensure(url.protocol === 'https:' && url.hostname === 'vercel.com' && !url.port &&
              !url.username && !url.password && !url.search && !url.hash &&
              /^\/sindicoadvanced\/condpulse\/[A-Za-z0-9]+$/.test(url.pathname), 'VERCEL_TARGET_INVALID');
            return url.href;
          }
          async function waitForDeployment() {
            const deadline = Date.now() + 180000;
            while (Date.now() < deadline) {
              const combined = await github('/commits/' + sha + '/status');
              const status = combined.statuses?.find(item => item.context === 'Vercel');
              if (status?.state === 'success') return checkedDeployment(status.target_url);
              ensure(!['failure', 'error'].includes(status?.state), 'VERCEL_DEPLOYMENT_FAILED');
              await sleep(5000);
            }
            throw new CheckError('VERCEL_DEPLOYMENT_TIMEOUT');
          }
          async function probe(path, expectedStatus) {
            const started = Date.now();
            let status = null, contentType = null, cacheControl = null;
            try {
              const response = await fetch(origin + path, {method: 'GET', redirect: 'manual',
                credentials: 'omit', headers: {Accept: 'application/json'}, signal: AbortSignal.timeout(30000)});
              status = response.status;
              contentType = response.headers.get('content-type');
              cacheControl = response.headers.get('cache-control');
              const body = await readJson(response, 16384);
              const checks = [];
              if (status !== expectedStatus) checks.push('HTTP_STATUS_UNEXPECTED');
              if (!/^application\/(?:[a-z0-9.+-]+\+)?json(?:\s*;|$)/i.test(contentType ?? ''))
                checks.push('CONTENT_TYPE_UNEXPECTED');
              if (!/(?:^|,)\s*no-store\s*(?:,|$)/i.test(cacheControl ?? ''))
                checks.push('NO_STORE_MISSING');
              if (!body || typeof body !== 'object' || Array.isArray(body)) checks.push('JSON_SHAPE_UNEXPECTED');
              if (path === '/actuator/health/readiness') {
                if (body?.status !== 'UP') checks.push('READINESS_NOT_UP');
                if (body && (Object.hasOwn(body, 'details') || Object.hasOwn(body, 'components')))
                  checks.push('HEALTH_DETAILS_EXPOSED');
              } else {
                if (body?.status !== 401 || body?.code !== 'AUTHENTICATION_REQUIRED')
                  checks.push('AUTH_PROBLEM_UNEXPECTED');
              }
              return {path, status, contentType, cacheControl, elapsedMs: Date.now() - started,
                bodyStatus: ['UP', 'DOWN', 'OUT_OF_SERVICE', 'UNKNOWN'].includes(body?.status) ? body.status : body?.status === 401 ? 401 : 'UNEXPECTED',
                problemCode: body?.code === 'AUTHENTICATION_REQUIRED' ? 'AUTHENTICATION_REQUIRED' : null,
                ok: checks.length === 0, checks};
            } catch (error) {
              return {path, status, contentType, cacheControl, elapsedMs: Date.now() - started,
                ok: false, checks: [error instanceof CheckError ? error.code :
                  ['AbortError', 'TimeoutError'].includes(error?.name) ? 'REQUEST_TIMEOUT' : 'REQUEST_FAILED']};
            }
          }
          try {
            console.log(JSON.stringify({phase: 'WAITING_FOR_VERCEL', sourceSha: sha}));
            const deployment = await waitForDeployment();
            await requireCurrentHead();
            const initialProbes = await Promise.all([
              probe('/actuator/health/readiness', 200),
              probe('/v1/me', 401)
            ]);
            const probes = initialProbes.map(item => ({...item, checks: [...item.checks]}));
            const startupReadiness = [];
            const startupOnly = item => item.status === 503 && item.bodyStatus === 'OUT_OF_SERVICE' &&
              item.checks.length === 2 && item.checks.every(code =>
                code === 'HTTP_STATUS_UNEXPECTED' || code === 'READINESS_NOT_UP');
            for (let attempt = 0; attempt < 2 && startupOnly(probes[0]); attempt++) {
              await sleep(1000);
              const result = await probe('/actuator/health/readiness', 200);
              startupReadiness.push(result);
              probes[0] = {...result, checks: [...result.checks]};
            }
            await requireCurrentHead();
            const passed = probes.every(item => item.ok);
            console.log(JSON.stringify({version: 2, sourceSha: sha, vercelDeployment: deployment,
              observedAt: new Date().toISOString(), headUnchanged: true,
              startupGraceUsed: startupReadiness.length > 0, initialProbes, startupReadiness, passed, probes}));
            if (!passed) process.exitCode = 1;
          } catch (error) {
            console.log(JSON.stringify({phase: 'FAILED', sourceSha: sha,
              code: error instanceof CheckError ? error.code : 'REQUEST_FAILED'}));
            process.exitCode = 1;
          }
          PUBLIC_SMOKE
