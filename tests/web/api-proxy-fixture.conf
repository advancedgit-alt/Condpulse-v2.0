# Exclusivo do runner CI. Nao faz parte do Dockerfile nem dos assets distribuidos.
server {
    listen 8080;
    server_name _;
    access_log off;
    default_type application/json;
    add_header X-CI-Upstream-IP $server_addr always;
    add_header X-CI-Request-URI $request_uri always;
    add_header X-CI-Method $request_method always;
    add_header X-CI-Authorization $http_authorization always;
    add_header X-CI-CSRF $http_x_csrf_token always;
    add_header X-CI-Idempotency $http_idempotency_key always;
    add_header X-CI-Cookie $http_cookie always;
    add_header Set-Cookie "__Host-condpulse=ci_fixture; Path=/; Secure; HttpOnly; SameSite=Lax" always;
    location = /v1/me {
        return 401 '{"code":"AUTHENTICATION_REQUIRED"}';
    }
    location = /auth/login {
        return 400 '{"code":"CI_LOGIN_REFUSED"}';
    }
    location / {
        return 404 '{"code":"CI_ROUTE_NOT_FOUND"}';
    }
}
