spring:
  application:
    name: condpulse
  profiles:
    default: api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 0
      connection-timeout: 5000
  flyway:
    enabled: false
  sql:
    init:
      mode: never
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
condpulse:
  reservations:
    enabled: ${CP_RESERVATIONS_ENABLED:false}
  management:
    enabled: ${CP_MANAGEMENT_ENABLED:false}
  platform:
    enabled: ${CP_PLATFORM_ENABLED:false}
    billing-enabled: ${CP_PLATFORM_BILLING_ENABLED:false}
  parcels:
    enabled: ${CP_PARCELS_ENABLED:false}
    # HMAC do código de retirada delegada (32 bytes Base64, do cofre); ausente = delegação indisponível.
    code-key: ${CP_PARCEL_CODE_KEY:}
  visits:
    enabled: ${CP_VISITS_ENABLED:false}
  notifications:
    enabled: ${CP_NOTIFICATIONS_ENABLED:false}
  announcements:
    enabled: ${CP_ANNOUNCEMENTS_ENABLED:false}
  requests:
    enabled: ${CP_REQUESTS_ENABLED:false}
  access-credentials:
    enabled: ${CP_ACCESS_CREDENTIALS_ENABLED:false}
  facial-access:
    # Acesso facial (pacote v1.1, docs/integracoes/facial). Desligado por padrão; ligar só com OK do responsável.
    enabled: ${CP_FACIAL_ACCESS_ENABLED:false}
    # Validade máxima da concessão técnica emitida pelo painel da plataforma (1 a 90 dias).
    technical-grant-max-days: ${CP_TECHNICAL_GRANT_MAX_DAYS:30}
    # Chave AES-256 (base64) da data de nascimento protegida; opcional (sem ela só a atestação funciona). Só no servidor.
    age-evidence-key: ${CP_AGE_EVIDENCE_KEY:}
    age-evidence-key-version: ${CP_AGE_EVIDENCE_KEY_VERSION:v1}
  partners:
    # Hierarquia de parceiro (V049, ADR-0011). Desligada por padrão; fatia nova até o portão da Onda 0.
    enabled: ${CP_PARTNERS_ENABLED:false}
  demo:
    # Condomínio demo (CPX-046, V053, ADR-0012): criar/resetar pela central. Desligado por padrão; ligar só na homologação.
    enabled: ${CP_DEMO_ENABLED:false}
  security-log:
    # Log de Segurança (V050, PRD complementar seção 5): API de busca/integridade/exportação, SENSITIVE_VIEWED nas
    # consultas sensíveis e âncora diária no worker. Desligado por padrão; a gravação das fontes é do banco (V050).
    enabled: ${CP_SECURITY_LOG_ENABLED:false}
  realtime:
    enabled: ${CP_REALTIME_ENABLED:false}
    tick-seconds: ${CP_REALTIME_TICK_SECONDS:5}
    lifetime-seconds: ${CP_REALTIME_LIFETIME_SECONDS:300}
    max-streams: ${CP_REALTIME_MAX_STREAMS:40}
    max-per-account: ${CP_REALTIME_MAX_PER_ACCOUNT:3}
  finance:
    # Financeiro condominial com Asaas (ADR-0008), somente sandbox. Ligado exige a chave e o token do webhook.
    enabled: ${CP_FINANCE_ENABLED:false}
    asaas-api-key: ${CP_ASAAS_API_KEY:}
    asaas-webhook-token: ${CP_ASAAS_WEBHOOK_TOKEN:}
  files:
    enabled: ${CP_FILES_ENABLED:false}
    service-key: ${CP_STORAGE_SERVICE_KEY:}
    bucket: ${CP_STORAGE_BUCKET:cp-upload-quarantine}
  worker:
    outbox-enabled: ${CP_WORKER_OUTBOX_ENABLED:false}
    poll-millis: ${CP_WORKER_POLL_MILLIS:2000}
    waitlist-enabled: ${CP_WORKER_WAITLIST_ENABLED:false}
    waitlist-millis: ${CP_WORKER_WAITLIST_MILLIS:60000}
    access-sync-enabled: ${CP_WORKER_ACCESS_SYNC_ENABLED:false}
    access-sync-millis: ${CP_WORKER_ACCESS_SYNC_MILLIS:15000}
  bff:
    enabled: ${CP_BFF_ENABLED:false}
    origin: ${CP_BFF_ORIGIN:}
    publishable-key: ${CP_SUPABASE_PUBLISHABLE_KEY:}
    encryption-key: ${CP_BFF_ENCRYPTION_KEY:}
    rate-limit-key: ${CP_BFF_RATE_LIMIT_KEY:}
    session-hours: ${CP_BFF_SESSION_HOURS:8}
    recovery-enabled: ${CP_BFF_RECOVERY_ENABLED:false}
  auth:
    issuer: ${CP_JWT_ISSUER:}
    jwk-set-uri: ${CP_JWT_JWK_SET_URI:}
---
spring:
  config:
    activate:
      on-profile: worker
  main:
    web-application-type: none
    keep-alive: true
  task:
    scheduling:
      shutdown:
        # Encerramento espera a passada em curso; arrendamento vencido cobre a queda abrupta.
        await-termination: true
        await-termination-period: 15s
---
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
  flyway:
    enabled: true
    default-schema: platform
    schemas: platform,cp
    locations: classpath:db/migration
    clean-disabled: true
    validate-migration-naming: true
    baseline-on-migrate: false

