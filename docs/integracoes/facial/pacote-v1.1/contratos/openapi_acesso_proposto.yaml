openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: CondPulse — Delta PROPOSTO de acesso físico e homologação
  version: 1.1.0-proposta
  summary: Contrato proposto para integração com o CondPulse; não é API de fabricante nem release implantada.
  description: 'Especificação de projeto de 30/10/2026. Deve ser reconciliada com autenticação, erros, rotas e operations
    existentes antes da implementação. Não declara testes físicos, integração concluída ou publicação em produção.
    Todo tenant e ator efetivo é resolvido pelo servidor. UUID no caminho é seletor de escopo validado, não autoridade.
    Nenhuma resposta contém senha, token de fabricante, chave privada ou referência de cofre. HTTP 202 indica aceitação
    assíncrona; não aplicação, homologação, abertura ou passagem. Os exemplos são sintéticos. Segurança de escrita:
    cookie de sessão E CSRF juntos, OU bearer exclusivamente para cliente não-browser aprovado; uma chamada com
    sessão de navegador não usa bearer para contornar CSRF. Validar Origin e vínculo atual no backend. mTLS de máquina
    é obrigatório no edge; nunca confiar em tenant no payload.'
servers:
- url: https://api.condpulse.example
  description: Endereço ilustrativo reservado .example; substituir apenas após definir ambiente. Nenhum endpoint
    real foi provisionado.
x-status: PROPOSTA_NAO_IMPLEMENTADA_NAO_HOMOLOGADA
x-specification-date: '2026-10-30'
x-authentication-policy:
  browser: sessionCookie + csrfToken para POST/PATCH e validação de Origin; nome do cookie é proposto e deve coincidir
    com BFF atual.
  nonBrowser: bearerAuth de cliente aprovado; sem aceitar este ramo como fuga de CSRF de sessão browser.
  edge: Identidade e tenant derivados do certificado registrado; payload não aceita tenantId/actorId.
  authorization: Verificar vínculo atual, grants técnicos, escopo físico e estado do recurso em toda operação.
x-idempotency-policy: 'Retenção de recibos cobre a janela de reentrega aprovada. Abertura é distinta de sincronização:
  depois de DISPATCH_COMMITTED, falha ambígua, expiração ou failover, não reatribuir/reexecutar o mesmo comando.
  Desativar retries implícitos de HTTP/SDK/proxy para operações físicas sem idempotência nativa ensaiada.'
