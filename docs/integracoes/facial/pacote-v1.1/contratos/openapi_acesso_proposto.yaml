          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-concurrency-resource: connector.revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSecretRequest'
      x-tenant-resolution: authenticated_actor_and_authorized_path_scope
  /v1/tenants/{tenantId}/operations/{operationId}:
    get:
      operationId: getAccessOperation
      tags:
      - Operacoes
      summary: Consultar operação preservando contrato existente
      description: Projeção proposta a unificar com operations existente no CondPulse. Não criar segundo executor
        ou fonte divergente. Restringir resultado ao escopo da operação e do ator.
      x-status: PROPOSTA
      x-permissions:
      - tenant.operations.read
      x-permission-combination: ALL
      security:
      - sessionCookie: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/tenantId'
      - $ref: '#/components/parameters/operationId'
      responses:
        '200':
          description: Resultado no escopo autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-tenant-resolution: authenticated_actor_and_authorized_path_scope
  /v1/edge/events:
    post:
      operationId: ingestEdgeEvents
      tags:
      - Edge
      summary: Receber eventos em inbox durável via mTLS
      description: Tenant resolvido do certificado; sourceConnectorId deve coincidir com identidade autenticada.
        Deduplicar sem usar conector como identidade do evento. ACK após persistência. REJECTED por item é explícito;
        nenhuma ingestão aciona hardware.
      x-status: PROPOSTA
      x-permissions:
      - machine.edge.events.write
      x-permission-combination: ALL
      security:
      - edgeMutualTLS: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Aceitação assíncrona; consulte o recurso/recibo para aplicação e resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatchAccepted'
          headers:
            Location:
              description: URI relativa de consulta de recibo/operação; não é URL de hardware.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeEventBatch'
            examples:
              event:
                summary: Evento sintético de reconhecimento; não comprova abertura
                value:
                  schemaVersion: '1.0'
                  events:
                  - schemaVersion: '1.0'
                    eventId: 00000000-0000-4000-8000-000000000201
                    deviceId: 00000000-0000-4000-8000-000000000202
                    deviceProvisioningId: 00000000-0000-4000-8000-000000000203
                    eventEpoch: EXEMPLO-BOOT-0001
                    nativeEventId: EXEMPLO-000042
                    sourceConnectorId: 00000000-0000-4000-8000-000000000204
                    bindingRevision: null
                    pointId: null
                    subjectRef: EXEMPLO-PESSOA-001
                    kind: IDENTITY_RECOGNIZED
                    occurredAt: '2026-10-30T15:00:00-03:00'
                    direction: UNKNOWN
                    timeQuality: DEVICE_UNVERIFIED
                    correlationId: 00000000-0000-4000-8000-000000000205
                    policyVersion: null
                    evidence:
                      level: DEVICE_REPORTED
                      sourceKind: DEVICE_EVENT
                      nativeKind: EXEMPLO_RECONHECIMENTO
                      evidenceRef: null
                      inferenceReason: null
                    deviceChannelId: null
                    nativeChannelId: null
      x-tenant-resolution: certificate_registry_only
  /v1/edge/decisions:
    post:
      operationId: ingestEdgeDecision
      tags:
      - Edge
      summary: Registrar decisão já tomada no gateway, sem poder de abertura
      description: Ingestão autenticada e idempotente de telemetria. O motor de regras e adaptador de EDGE_ONLINE
        executam localmente; WAN/nuvem não é dependência obrigatória do caminho pré-relé. Persistir registro antes
        do ACK. A resposta apenas reconhece entrega e nunca cria grant, autoriza abertura ou repete comando. Reentrega
        de decisão antiga preserva o registro histórico; nenhuma validade é renovada. A perda desta resposta não
        induz nova abertura.
      x-status: PROPOSTA
      x-permissions:
      - machine.edge.decisions.write
      x-permission-combination: ALL
      security:
      - edgeMutualTLS: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '202':
          description: Telemetria recebida de forma durável ou duplicata reconhecida; não autoriza atuação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeDecisionIngestReceipt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeDecisionRequest'
      x-tenant-resolution: certificate_registry_only
      x-side-effects: durable_telemetry_only_no_hardware_command
      x-decision-authority: local_gateway_or_homologated_local_adapter
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: condpulse_session
      description: Nome proposto a reconciliar com BFF existente. Cookie HttpOnly/Secure; servidor resolve ator
        e sessão atual.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Validar contra sessão/canal e Origin; apenas presença não basta. AND com sessionCookie em escritas
        browser.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token aprovado para cliente não-browser; validar emissor, audiência, assinatura, expiração, revogação
        e vínculo atual.
    edgeMutualTLS:
      type: mutualTLS
      description: Certificado de máquina por conector/provisionamento; tenant e autoridade derivados do registro.
        Validar cadeia, expiração, revogação e escopo do dispositivo.
  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    modelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    homologationId:
      name: homologationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    areaId:
      name: areaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    pointId:
      name: pointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    bindingId:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    policyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    versionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    deploymentId:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    installationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    connectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    commandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    operationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID do recurso. Existência, vínculo atual e escopo são conferidos no servidor; o identificador
        não concede permissão.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Chave única por intenção, escopada no servidor por ator/tenant/operação. Mesmo payload retorna
        recibo existente sem novo efeito; payload diferente retorna 409. Para abertura, nunca provoca reenvio de
        comando comprometido, UNKNOWN ou EXPIRED.
    ExpectedRevision:
      name: X-Expected-Revision
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      description: Revisão numérica atual do recurso indicado em x-concurrency-resource. Divergência retorna 409.
        Header proposto a reconciliar com o mecanismo de concorrência existente; não usa If-Match com semântica
        HTTP incorreta.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Cursor opaco, vinculado ao escopo autorizado e filtros.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    BadRequest:
      description: Requisição inválida ou JSON fora do contrato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Autenticação ausente, inválida ou expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Sem escopo, vínculo, autorização física, CSRF válido ou permissão técnica.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso inexistente ou não visível; não revela outro tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflito de revisão/estado/idempotência; sem repetição automática de efeito físico.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Política/capacidade/evidência/contexto incompatível.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Limite de taxa ou concorrência atingido; retentar operação administrativa conforme Retry-After,
        nunca repetir abertura ambígua.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Espera sugerida em segundos; não autoriza replay de abertura.
          schema:
            type: integer
            minimum: 1
    Unavailable:
      description: Dependência indisponível. Não afirma que operação transmitida jamais ocorreu; consultar recibo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Espera sugerida em segundos; não autoriza replay de abertura.
          schema:
            type: integer
            minimum: 1
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - VERSION_CONFLICT
          - IDEMPOTENCY_CONFLICT
          - STATE_CONFLICT
          - CAPABILITY_NOT_SUPPORTED
          - POLICY_INCOMPATIBLE
          - EVIDENCE_MISSING
          - RATE_LIMITED
          - DEPENDENCY_UNAVAILABLE
          - VALIDATION_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 500
        requestId:
          type: string
          format: uuid
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
          minItems: 0
          maxItems: 50
      required:
      - code
      - message
      - requestId
      description: Envelope proposto. Mensagens não revelam existência de recurso de outro tenant nem segredos,
        fotos ou payload bruto de fabricante.
    ValidationIssue:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        pointer:
          type: string
          minLength: 1
          maxLength: 300
        message:
          type: string
          minLength: 1
          maxLength: 500
        severity:
          type: string
          enum:
          - BLOCKER
          - WARNING
          - INFO
        pointId:
          type:
          - string
          - 'null'
          format: uuid
        capability:
          type:
          - string
          - 'null'
          maxLength: 80
      required:
      - code
      - pointer
      - message
      - severity
    CapabilityEvidence:
      type: object
      additionalProperties: false
      properties:
        documented:
          type:
          - boolean
          - 'null'
        observed:
          type:
          - boolean
          - 'null'
        approved:
          type:
          - boolean
          - 'null'
        evidenceRefs:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
          maxItems: 100
          uniqueItems: true
        limitations:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 400
          minItems: 0
          maxItems: 30
      required:
      - documented
      - observed
      - approved
      - evidenceRefs
      - limitations
