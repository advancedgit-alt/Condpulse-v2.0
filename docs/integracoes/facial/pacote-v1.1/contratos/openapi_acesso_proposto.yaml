      - schemaVersion
      - eventId
      - deviceId
      - deviceProvisioningId
      - eventEpoch
      - nativeEventId
      - sourceConnectorId
      - bindingRevision
      - pointId
      - subjectRef
      - kind
      - occurredAt
      - direction
      - timeQuality
      - correlationId
      - policyVersion
      - evidence
      - deviceChannelId
      - nativeChannelId
      description: 'Evento sintaticamente submetido pelo gateway, não uma declaração livre de tenant. O servidor
        deriva tenant e conector autenticado do certificado, confere sourceConnectorId e o vínculo do dispositivo.
        Deduplicação: tenant + deviceProvisioningId + eventEpoch + nativeEventId; sourceConnectorId é somente proveniência.
        Sem ID nativo confiável, adaptador usa chave comprovada e indica limitação. receivedAt é atribuído pelo
        servidor. Resolver binding histórico; se incerto, bindingRevision/pointId ficam null e direção UNKNOWN.
        Canal desconhecido permanece null; um evento de controlador multiponto não é atribuído ao primeiro canal
        por padrão.'
    EdgeEventBatch:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: string
          const: '1.0'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EdgeEvent'
          minItems: 1
          maxItems: 100
      required:
      - schemaVersion
      - events
      description: Máximo proposto de 100 eventos por lote. Limites de bytes/profundidade/taxa também são aplicados
        no gateway e backend. Não dispara abertura.
    EventIngestResult:
      type: object
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACCEPTED
          - DUPLICATE
          - REJECTED
        receivedAt:
          type: string
          format: date-time
        reasonCode:
          type:
          - string
          - 'null'
          maxLength: 100
      required:
      - eventId
      - status
      - receivedAt
      - reasonCode
    EventBatchAccepted:
      type: object
      additionalProperties: false
      properties:
        batchId:
          type: string
          format: uuid
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventIngestResult'
          minItems: 1
          maxItems: 100
        durableInboxAcknowledged:
          type: boolean
          const: true
      required:
      - batchId
      - results
      - durableInboxAcknowledged
      description: ACK somente depois de persistir inbox ou reconhecer duplicata durável. REJECTED não significa
        persistência como evento válido. Aceitação não confirma acesso físico nem processamento de todos os efeitos.
    EdgeDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: string
          const: '1.0'
        decisionId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        sourceConnectorId:
          type: string
          format: uuid
        deviceProvisioningId:
          type: string
          format: uuid
        deviceChannelId:
          type: string
          format: uuid
        pointId:
          type:
          - string
          - 'null'
          format: uuid
        bindingRevision:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 2147483647
          description: Sequência monotônica por ponto no tenant; não é UUID.
        installationRevision:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 2147483647
          description: Sequência monotônica da instalação por tenant; não é UUID.
        policyVersion:
          type:
          - string
          - 'null'
          format: uuid
        recognizedSubjectRef:
          type:
          - string
          - 'null'
          maxLength: 160
        subjectContextRef:
          type:
          - string
          - 'null'
          format: uuid
        recognitionEventId:
          type:
          - string
          - 'null'
          format: uuid
        result:
          type: string
          enum:
          - ALLOW
          - DENY
          - REQUIRE_ASSISTANCE
          - UNAVAILABLE
        reasonCodes:
          type: array
          items:
            type: string
            enum:
            - ALLOWED
            - NO_ELIGIBLE_CONTEXT
            - TENANT_MISMATCH
            - AGE_BELOW_MINIMUM
            - AGE_NOT_VERIFIED
            - VISITOR_NOT_ALLOWED
            - PERMIT_EXPIRED
            - PERMIT_REVOKED
            - RESERVATION_REQUIRED
            - RESERVATION_CANCELLED
            - OUTSIDE_SCHEDULE
            - AREA_INTERDICTED
            - CAPABILITY_MISSING
            - COMPANION_NOT_VERIFIED
            - OCCUPANCY_LIMIT
            - ANTIPASSBACK_DENIED
            - REVOKED
            - STALE_POLICY
            - STALE_BINDING
            - CLOCK_UNTRUSTED
            - DEPENDENCY_UNAVAILABLE
            - NOT_COMMISSIONED
            - CONTEXT_CHANGED
            - ASSISTANCE_REQUIRED
            - CONTEXT_AMBIGUOUS
          minItems: 1
          maxItems: 30
          uniqueItems: true
        evaluatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        executionMode:
          type: string
          const: EDGE_ONLINE
        automaticActuationAllowed:
          type: boolean
          description: Metadado da decisão já tomada no gateway, não um comando. Deve ser false para DENY, REQUIRE_ASSISTANCE
            e UNAVAILABLE.
        policySnapshotHash:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
        clockQuality:
          type: string
          enum:
          - TRUSTED
          - UNTRUSTED
          - UNKNOWN
        evaluationDurationMs:
          type: integer
          minimum: 0
          maximum: 60000
      required:
      - schemaVersion
      - decisionId
      - attemptId
      - sourceConnectorId
      - deviceProvisioningId
      - deviceChannelId
      - pointId
      - bindingRevision
      - installationRevision
      - policyVersion
      - recognizedSubjectRef
      - subjectContextRef
      - recognitionEventId
      - result
      - reasonCodes
      - evaluatedAt
      - expiresAt
      - executionMode
      - automaticActuationAllowed
      - policySnapshotHash
      - clockQuality
      - evaluationDurationMs
      description: 'Telemetria de decisão tomada localmente no gateway/adaptador, conforme modo EDGE_ONLINE. Não
        é RPC de autorização na nuvem e não condiciona abertura à resposta desta rota. Tenant e identidade técnica
        são derivados do certificado; sourceConnectorId e referências devem corresponder ao escopo registrado. O
        motor local usa dados/revisões confiáveis e executa as verificações pré-relé homologadas. REQUIRE_ASSISTANCE
        significa negar atuação automática e orientar atendimento; UNAVAILABLE também não autoriza. Registro histórico
        pode chegar após expiresAt: ingestão preserva a ocorrência e nunca transforma resultado passado em autorização
        atual. Não recebe actorId, tenantId, idade ou grants livres.'
      allOf:
      - if:
          properties:
            result:
              const: ALLOW
          required:
          - result
        then:
          properties:
            automaticActuationAllowed:
              const: true
            pointId:
              type: string
              format: uuid
            bindingRevision:
              type: integer
              minimum: 1
              maximum: 2147483647
              description: Sequência monotônica por ponto no tenant; não é UUID.
            installationRevision:
              type: integer
              minimum: 1
              maximum: 2147483647
              description: Sequência monotônica da instalação por tenant; não é UUID.
            policyVersion:
              type: string
              format: uuid
            policySnapshotHash:
              type: string
              pattern: ^[a-f0-9]{64}$
            clockQuality:
              const: TRUSTED
        else:
          properties:
            automaticActuationAllowed:
              const: false
    EdgeDecisionIngestReceipt:
      type: object
      additionalProperties: false
      properties:
        decisionId:
          type: string
          format: uuid
        ingestId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACCEPTED
          - DUPLICATE
          - REJECTED
        receivedAt:
          type: string
          format: date-time
        reasonCode:
          type:
          - string
          - 'null'
          maxLength: 100
        actuationAuthorizedByThisResponse:
          type: boolean
          const: false
      required:
      - decisionId
      - ingestId
      - status
      - receivedAt
      - reasonCode
      - actuationAuthorizedByThisResponse
      description: Recibo de telemetria após gravação durável ou reconhecimento de duplicata. Não devolve ALLOW
        operacional, authorizationRef, token ou comando. A resposta nunca autoriza abertura, renova validade ou
        reexecuta decisão. Identidade de deduplicação é tenant + decisionId; conector de entrega é proveniência
        verificada, sem multiplicar a decisão registrada.
    BindingDirectionMap:
      type: object
      additionalProperties: false
      properties:
        entry:
          type:
          - string
          - 'null'
          enum:
          - SOURCE_TO_DESTINATION
          - DESTINATION_TO_SOURCE
          - null
        exit:
          type:
          - string
          - 'null'
          enum:
          - SOURCE_TO_DESTINATION
          - DESTINATION_TO_SOURCE
          - null
      required:
      - entry
      - exit
      description: Mapeia leitores de entrada/saída às áreas de origem/destino do ponto. null significa ausência
        de leitura nesse sentido, nunca ausência de saída física. Servidor confere coerência com leitores, planta
        e procedimento aprovado.
x-edge-decision-policy: POST /v1/edge/decisions é ingestão de decisão local e não RPC de autorização em nuvem. REQUIRE_ASSISTANCE
  e UNAVAILABLE não autorizam atuação automática. ACK/retry de telemetria nunca reexecuta abertura.
