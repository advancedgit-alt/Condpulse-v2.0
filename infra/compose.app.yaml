# Somente aplicacao; migracao e operacao manual usam compose.migrate.yaml.
services:
  api:
    image: ${CP_API_IMAGE:?Informe a imagem API aprovada por digest}
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 35s
    environment:
      SPRING_PROFILES_ACTIVE: api
      PORT: "8080"
      DATABASE_URL: ${CP_API_DATABASE_URL:?Informe a URL JDBC runtime com TLS verify-full}
      DATABASE_USER: ${CP_API_DATABASE_USER:?Informe o login runtime cp_api}
      DATABASE_PASSWORD: ${CP_API_DATABASE_PASSWORD:?Obtenha a senha runtime no cofre}
      DB_POOL_SIZE: "8"
      CP_JWT_ISSUER: ${CP_SUPABASE_URL:?Informe a origem do Supabase CondPulse}/auth/v1
      CP_JWT_JWK_SET_URI: ${CP_SUPABASE_URL:?Informe a origem do Supabase CondPulse}/auth/v1/.well-known/jwks.json
      CP_BFF_ORIGIN: ${CP_BFF_ORIGIN:?Informe a origem HTTPS exata da web}
      # Habilitacao exige uma alteracao revisada apos homologacao real.
      CP_BFF_ENABLED: "false"
      CP_RESERVATIONS_ENABLED: "false"
    expose: ["8080"]
    healthcheck:
      test: [CMD, java, "-Xmx16m", "-XX:+UseSerialGC", "-cp", /app/health, Healthcheck]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    volumes:
      - type: bind
        source: ${CP_DB_CA_FILE:?Informe o caminho absoluto da CA PostgreSQL validada}
        target: /run/secrets/db-ca.crt
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: ${CP_WEB_IMAGE:?Informe a imagem web aprovada por digest}
    user: "101:101"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 10s
    expose: ["8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, "-q", "-O", /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks: [backend, proxy]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
networks:
  # Rede exclusiva desta stack, com saida para Supabase Auth/PostgreSQL.
  backend:
    driver: bridge
  # Rede do proxy no host dedicado CondPulse, conferida antes de publicar.
  proxy:
    external: true
    name: ${CP_PROXY_NETWORK:?Informe a rede do proxy do host CondPulse}
